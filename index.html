<script>
    let state = {
      view: 'matches',
      user: JSON.parse(localStorage.getItem('vcup_user')) || null,
      sport: 'FOOTBALL',
      matches: []
    };

    const ADMIN_KEY = "MASTER123";

    function saveUser(user) {
      state.user = user;
      localStorage.setItem('vcup_user', JSON.stringify(user));
      render();
    }

    function navigate(view) {
      state.view = view;
      render();
    }

    function isLocked(dateStr) {
      const matchTime = new Date(dateStr).getTime();
      return (matchTime - Date.now()) <= (60 * 1000 * 60);
    }

    async function apiFetch(path, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };

      const res = await fetch(path, { ...options, headers });
      const text = await res.text();
      let data = null;

      try {
        data = text ? JSON.parse(text) : null;
      } catch (e) {
        data = text;
      }

      if (!res.ok) {
        throw new Error((data && (data.error || data.message)) || 'Request failed');
      }

      return data;
    }

    async function fetchMatchesAndSettle() {
      try {
        const data = await apiFetch('/api/matches');
        state.matches = Array.isArray(data) ? data.filter(Boolean) : [];
      } catch (e) {
        state.matches = [];
      }

      if (state.user && state.user.email) {
        try {
          const settleData = await apiFetch('/api/settle', {
            method: 'POST',
            body: JSON.stringify({ targetEmail: state.user.email })
          });

          if (settleData && settleData.success && settleData.balanceUpdates && settleData.balanceUpdates[state.user.email]) {
            const fresh = await apiFetch(`/api/bets?email=${encodeURIComponent(state.user.email)}`);
            if (fresh && fresh.user) {
              saveUser(fresh.user);
              alert(`🎉 ¡Premio acreditado! Has ganado ${(settleData.balanceUpdates[state.user.email] || 0).toFixed(2)} vCUP en el pozo común.`);
            }
          }
        } catch (e) {
          // Ignorar settle si no hay resultados nuevos
        }
      }

      render();
    }

    function render() {
      const app = document.getElementById('app');
      const userInfo = document.getElementById('userInfo');
      const heroBanner = document.getElementById('heroBanner');
      const bannerTitle = document.getElementById('bannerTitle');

      if (state.user) {
        userInfo.innerHTML = `<span class="text-green-400 font-semibold text-xs">${state.user.email} (${(state.user.balance || 0).toFixed(2)} vCUP)</span>`;
      } else {
        userInfo.innerHTML = `<button onclick="navigate('auth')" class="text-blue-400 font-bold underline">Ingresar</button>`;
      }

      if (state.sport === 'BASEBALL') {
        heroBanner.className = 'sport-banner-baseball h-36 p-4 flex flex-col justify-end border-b border-slate-800 transition-all duration-300';
        bannerTitle.innerText = 'Cartelera de Béisbol MLB';
      } else {
        heroBanner.className = 'sport-banner-football h-36 p-4 flex flex-col justify-end border-b border-slate-800 transition-all duration-300';
        bannerTitle.innerText = 'Cartelera de Fútbol Top';
      }

      if (window.location.hash === '#admin-portal' || state.view === 'admin') { renderAdmin(app); return; }
      if (!state.user && state.view !== 'auth') { renderAuth(app); return; }

      switch (state.view) {
        case 'wallet': renderWallet(app); break;
        case 'matches': renderMatches(app); break;
        case 'bets': renderBets(app); break;
        case 'auth': renderAuth(app); break;
      }
    }

    function renderAuth(container) {
      container.innerHTML = `
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center shadow-xl">
          <h2 class="text-xl font-bold mb-4 text-green-400">Iniciar Sesión / Registro</h2>
          <input id="authEmail" type="email" placeholder="Correo electrónico" class="w-full p-3 mb-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-green-500">
          <button onclick="login()" class="w-full bg-green-500 hover:bg-green-400 text-slate-950 font-extrabold p-3 rounded-xl mb-2 transition-colors">Entrar / Registrarse</button>
        </div>
      `;
    }

    async function login() {
      const email = document.getElementById('authEmail').value.trim().toLowerCase();
      if (!email) return alert('Ingresa tu correo');

      try {
        const data = await apiFetch('/api/bets', {
          method: 'POST',
          body: JSON.stringify({ action: 'register', email })
        });

        saveUser(data.user);
        navigate('matches');
      } catch (e) {
        alert(e.message || 'Error al iniciar sesión');
      }
    }

    function renderWallet(container) {
      container.innerHTML = `
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 neon-border mb-6 text-center">
          <p class="text-[11px] text-slate-400 uppercase tracking-widest font-bold mb-1">Saldo Disponible</p>
          <h2 class="text-4xl font-black text-green-400 mb-2">${(state.user.balance || 0).toFixed(2)} <span class="text-sm font-normal text-slate-300">vCUP</span></h2>
          <span class="inline-block bg-slate-800 border border-slate-700 text-slate-300 text-[10px] px-3 py-1 rounded-full">Recargas vía WhatsApp</span>
        </div>
        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
          <h3 class="text-sm font-bold text-slate-200 mb-3">🚀 Transferir vCUP Instantáneo</h3>
          <input id="tEmail" type="email" placeholder="Correo destino" class="w-full p-3 mb-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white">
          <input id="tAmount" type="number" placeholder="Monto vCUP" class="w-full p-3 mb-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white">
          <button onclick="sendTransfer()" class="w-full bg-blue-600 font-bold p-3 rounded-xl text-white">Enviar Saldo</button>
        </div>
      `;
    }

    async function sendTransfer() {
      const email = document.getElementById('tEmail').value.trim().toLowerCase();
      const amount = parseFloat(document.getElementById('tAmount').value);

      if (!email || !amount || amount <= 0 || amount > (state.user.balance || 0)) {
        return alert('Datos inválidos o saldo insuficiente');
      }

      try {
        await apiFetch('/api/transfer', {
          method: 'POST',
          body: JSON.stringify({
            fromEmail: state.user.email,
            toEmail: email,
            amount
          })
        });

        const fresh = await apiFetch(`/api/bets?email=${encodeURIComponent(state.user.email)}`);
        saveUser(fresh.user);
        alert('Transferencia exitosa');
      } catch (e) {
        alert(e.message || 'Error al transferir');
      }
    }

    function renderMatches(container) {
      container.innerHTML = `
        <div class="flex gap-2 mb-4">
          <button onclick="setSport('FOOTBALL')" class="flex-1 p-2.5 rounded-xl font-bold text-xs ${state.sport === 'FOOTBALL' ? 'bg-green-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800'}">Fútbol</button>
          <button onclick="setSport('BASEBALL')" class="flex-1 p-2.5 rounded-xl font-bold text-xs ${state.sport === 'BASEBALL' ? 'bg-green-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800'}">Béisbol</button>
        </div>
        <div id="mList" class="space-y-4"></div>
      `;

      const list = document.getElementById('mList');
      const filtered = state.matches.filter((m) => m.sport === state.sport);

      if (filtered.length === 0) {
        list.innerHTML = `<p class="text-center text-xs text-slate-500 py-8">No hay partidos reales en la próxima semana. Vuelve a revisar en unos minutos.</p>`;
        return;
      }

      filtered.forEach((m) => {
        const locked = isLocked(m.date);
        list.innerHTML += `
          <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-lg">
            <div class="bg-slate-950 px-4 py-2 flex justify-between text-[11px] text-slate-400 border-b border-slate-800">
              <span class="text-green-400 font-semibold">${m.league}</span>
              <span>🕒 ${new Date(m.date).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })}</span>
            </div>
            <div class="p-4">
              <div class="flex justify-between items-center mb-4">
                <div class="flex flex-col items-center w-1/3 text-center"><img src="${m.homeLogo}" class="w-10 h-10 object-contain mb-1"><span class="text-xs font-bold text-white">${m.homeTeam}</span></div>
                <div class="text-xs font-black text-slate-500">VS</div>
                <div class="flex flex-col items-center w-1/3 text-center"><img src="${m.awayLogo}" class="w-10 h-10 object-contain mb-1"><span class="text-xs font-bold text-white">${m.awayTeam}</span></div>
              </div>
              <div class="bg-slate-950 p-2 rounded-xl text-center mb-3 border border-slate-800"><span class="text-[10px] text-slate-400 block uppercase">Pozo Común</span><span class="text-sm font-black text-green-400">${(m.totalPool || 150).toFixed(2)} vCUP</span></div>
              ${locked ? `<button disabled class="w-full bg-slate-800/60 text-slate-500 p-2.5 rounded-xl text-xs font-bold">🔒 Apuestas Cerradas (60 min antes)</button>` : `
                <div class="grid grid-cols-${m.sport === 'FOOTBALL' ? '3' : '2'} gap-2">
                  <button onclick="placeBet('${m.id}', 'HOME')" class="bg-slate-800 hover:bg-slate-700 text-green-400 p-2.5 rounded-xl text-xs font-bold">1 (Local)</button>
                  ${m.sport === 'FOOTBALL' ? `<button onclick="placeBet('${m.id}', 'DRAW')" class="bg-slate-800 hover:bg-slate-700 text-yellow-400 p-2.5 rounded-xl text-xs font-bold">X (Empate)</button>` : ''}
                  <button onclick="placeBet('${m.id}', 'AWAY')" class="bg-slate-800 hover:bg-slate-700 text-blue-400 p-2.5 rounded-xl text-xs font-bold">2 (Visita)</button>
                </div>
              `}
            </div>
          </div>`;
      });
    }

    function setSport(s) {
      state.sport = s;
      render();
    }

    async function placeBet(matchId, choice) {
      if (!state.user) return navigate('auth');

      const match = state.matches.find((item) => item.id === matchId);
      const amount = parseFloat(prompt('Monto vCUP a apostar al Pozo Común:'));

      if (!amount || amount <= 0 || amount > (state.user.balance || 0)) {
        return alert('Monto inválido o saldo insuficiente');
      }

      try {
        const data = await apiFetch('/api/bets', {
          method: 'POST',
          body: JSON.stringify({
            action: 'place',
            email: state.user.email,
            matchId,
            choice,
            amount,
            sport: match?.sport || 'FOOTBALL',
            matchDate: match?.date
          })
        });

        if (data && data.user) {
          saveUser(data.user);
        }

        alert(data && data.message ? data.message : '¡Apuesta registrada con éxito!');
        render();
      } catch (e) {
        alert(e.message || 'No se pudo registrar la apuesta');
      }
    }

    async function renderBets(container) {
      if (!state.user) {
        container.innerHTML = '<p class="text-center text-xs text-slate-500 py-6">Debes iniciar sesión.</p>';
        return;
      }

      try {
        const data = await apiFetch(`/api/bets?email=${encodeURIComponent(state.user.email)}`);
        const bets = Array.isArray(data.bets) ? data.bets : [];

        container.innerHTML = `<h3 class="text-lg font-bold mb-4 text-green-400">Mis Últimas Apuestas</h3>`;

        if (!bets.length) {
          container.innerHTML += `<p class="text-center text-xs text-slate-500 py-6">No tienes apuestas registradas.</p>`;
          return;
        }

        bets.slice(0, 10).forEach((b) => {
          container.innerHTML += `
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 mb-3 text-xs">
              <div class="flex justify-between text-slate-400 mb-1"><span>Partido: ${b.match_id}</span><span class="${b.settled === 1 ? 'text-green-400 font-bold' : 'text-yellow-400'}">${b.settled === 1 ? 'Liquidada' : 'Activa'}</span></div>
              <div class="font-bold text-white">Opción: ${b.choice} | Monto: ${Number(b.amount).toFixed(2)} vCUP</div>
              <div class="text-slate-400">${b.sport || 'FOOTBALL'} | ${b.match_date ? new Date(b.match_date).toLocaleString() : 'Sin fecha'}</div>
            </div>`;
        });
      } catch (e) {
        container.innerHTML = `<p class="text-center text-xs text-red-400 py-6">${e.message || 'Error al cargar apuestas'}</p>`;
      }
    }

    function renderAdmin(container) {
      container.innerHTML = `
        <div class="bg-slate-900 p-6 rounded-2xl border border-red-500/30">
          <h2 class="text-xl font-bold text-red-400 mb-4">🔐 Admin Portal</h2>
          <div id="adminLock"><input id="masterKey" type="password" placeholder="Llave Maestra" class="w-full p-3 mb-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white"><button onclick="unlockAdmin()" class="w-full bg-red-500 font-bold p-3 rounded-xl text-white">Entrar</button></div>
          <div id="adminContent" class="hidden">
            <input id="admEmail" type="email" placeholder="Correo usuario" class="w-full p-2.5 mb-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white">
            <input id="admAmount" type="number" placeholder="Monto vCUP (+ o -)" class="w-full p-2.5 mb-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white">
            <button onclick="adminAdjustBalance()" class="w-full bg-green-500 font-bold p-2.5 rounded-xl text-slate-950 text-xs mb-3">Actualizar Saldo</button>
            <input id="admWa" type="text" placeholder="Teléfono WhatsApp (Ej: 5351576767)" class="w-full p-2.5 mb-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white">
            <button onclick="adminUpdateWa()" class="w-full bg-blue-600 font-bold p-2.5 rounded-xl text-white text-xs">Guardar WhatsApp</button>
          </div>
        </div>`;
    }

    function unlockAdmin() {
      if (document.getElementById('masterKey').value === ADMIN_KEY) {
        document.getElementById('adminLock').classList.add('hidden');
        document.getElementById('adminContent').classList.remove('hidden');
      } else alert('Llave incorrecta');
    }

    function adminAdjustBalance() {
      const email = document.getElementById('admEmail').value;
      const amt = parseFloat(document.getElementById('admAmount').value);
      if (!email || isNaN(amt)) return;

      let users = JSON.parse(localStorage.getItem('vcup_db_users') || '{}');
      users[email] = (users[email] || 0) + amt;
      localStorage.setItem('vcup_db_users', JSON.stringify(users));

      if (state.user && state.user.email === email) {
        state.user.balance = users[email];
        saveUser(state.user);
      }

      alert('Saldo actualizado');
    }

    function adminUpdateWa() {
      const wa = document.getElementById('admWa').value;
      if (!wa) return;
      document.getElementById('waButton').href = `https://wa.me/${wa}?text=Hola,%20deseo%20solicitar%20recarga%20de%20vCUP`;
      alert('WhatsApp actualizado');
    }

    window.addEventListener('hashchange', render);
    fetchMatchesAndSettle();
</script>
