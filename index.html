<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vCUP Sports Wallet</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    .neon-border { box-shadow: 0 0 15px rgba(34, 197, 94, 0.25); }
    .sport-banner-football {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.4) 0%, rgba(15, 23, 42, 0.95) 100%), 
                  url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=800&auto=format&fit=crop');
      background-size: cover; background-position: center;
    }
    .sport-banner-baseball {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.4) 0%, rgba(15, 23, 42, 0.95) 100%), 
                  url('https://images.unsplash.com/photo-1562077772-3bd90403f7f0?q=80&w=800&auto=format&fit=crop');
      background-size: cover; background-position: center;
    }
  </style>
</head>
<body class="pb-24">

  <!-- Header / TopBar -->
  <header class="p-4 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-green-500/10 border border-green-500/30 flex items-center justify-center font-bold text-green-400 text-sm">vC</div>
      <h1 class="text-lg font-bold text-slate-100 tracking-wider">vCUP <span class="text-green-400">Sports</span></h1>
    </div>
    <div id="userInfo" class="text-xs text-slate-400">Sin sesión</div>
  </header>

  <!-- Banner Promocional HD Dinámico -->
  <div id="heroBanner" class="sport-banner-football h-36 p-4 flex flex-col justify-end border-b border-slate-800 transition-all duration-300">
    <span class="text-[10px] font-bold tracking-widest text-green-400 uppercase bg-green-950/80 border border-green-500/30 px-2 py-0.5 rounded w-max mb-1">Pozo Común Real-Time</span>
    <h2 id="bannerTitle" class="text-xl font-extrabold text-white drop-shadow-md">Cartelera de Fútbol</h2>
    <p class="text-xs text-slate-300">Apuesta saldo vCUP en vivo y comparte el pozo con los ganadores.</p>
  </div>

  <!-- Main Container -->
  <main id="app" class="p-4 max-w-md mx-auto">
    <!-- Vista dinámica renderizada vía JavaScript -->
  </main>

  <!-- Navegación Inferior (Tabs) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 flex justify-around p-3 z-40">
    <button onclick="navigate('matches')" class="flex flex-col items-center text-xs font-semibold text-slate-400 hover:text-green-400">
      <span class="text-lg">🏆</span> Cartelera
    </button>
    <button onclick="navigate('wallet')" class="flex flex-col items-center text-xs font-semibold text-slate-400 hover:text-green-400">
      <span class="text-lg">💳</span> Billetera
    </button>
    <button onclick="navigate('bets')" class="flex flex-col items-center text-xs font-semibold text-slate-400 hover:text-green-400">
      <span class="text-lg">📜</span> Apuestas
    </button>
  </nav>

  <!-- Botón Flotante WhatsApp Soporte -->
  <a id="waButton" href="https://wa.me/5351576767?text=Hola,%20deseo%20solicitar%20recarga%20de%20vCUP" target="_blank" 
     class="fixed bottom-20 right-4 bg-green-500 text-slate-950 p-3 rounded-full shadow-lg z-50 text-2xl font-bold hover:scale-105 transition-transform flex items-center justify-center w-12 h-12">
    💬
  </a>

  <script>
    let state = {
      view: 'wallet',
      user: JSON.parse(localStorage.getItem('vcup_user')) || null,
      sport: 'FOOTBALL',
      matches: [],
      bets: []
    };

    const ADMIN_KEY = "MASTER123";

    function saveUser(user) {
      state.user = user;
      localStorage.setItem('vcup_user', JSON.stringify(user));
      render();
    }

    function navigate(view) {
      state.view = view;
      render();
    }

    function isLocked(matchDateStr) {
      const matchTime = new Date(matchDateStr).getTime();
      const now = new Date().getTime();
      const diffMinutes = (matchTime - now) / (1000 * 60);
      return diffMinutes <= 60;
    }

    async function fetchMatches() {
      try {
        const res = await fetch('/api/matches');
        if (res.ok) {
          state.matches = await res.json();
        }
      } catch (e) {
        console.log("Error al consultar API");
      }
    }

    function render() {
      const app = document.getElementById('app');
      const userInfo = document.getElementById('userInfo');
      const heroBanner = document.getElementById('heroBanner');
      const bannerTitle = document.getElementById('bannerTitle');

      if (state.user) {
        userInfo.innerHTML = `<span class="text-green-400 font-semibold text-xs">${state.user.email}</span>`;
      } else {
        userInfo.innerHTML = `<button onclick="navigate('auth')" class="text-blue-400 font-bold underline">Ingresar</button>`;
      }

      // Actualización de Banner Deportivo HD según el deporte activo
      if (state.sport === 'BASEBALL') {
        heroBanner.className = 'sport-banner-baseball h-36 p-4 flex flex-col justify-end border-b border-slate-800 transition-all duration-300';
        bannerTitle.innerText = 'Cartelera de Béisbol MLB';
      } else {
        heroBanner.className = 'sport-banner-football h-36 p-4 flex flex-col justify-end border-b border-slate-800 transition-all duration-300';
        bannerTitle.innerText = 'Cartelera de Fútbol Top';
      }

      if (window.location.hash === '#admin-portal' || state.view === 'admin') {
        renderAdmin(app);
        return;
      }

      if (!state.user && state.view !== 'auth') {
        renderAuth(app);
        return;
      }

      switch (state.view) {
        case 'wallet': renderWallet(app); break;
        case 'matches': renderMatches(app); break;
        case 'bets': renderBets(app); break;
        case 'auth': renderAuth(app); break;
      }
    }

    function renderAuth(container) {
      container.innerHTML = `
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center shadow-xl">
          <h2 class="text-xl font-bold mb-4 text-green-400">Iniciar Sesión / Registro</h2>
          <input id="authEmail" type="email" placeholder="Correo electrónico" class="w-full p-3 mb-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-green-500">
          <input id="authPass" type="password" placeholder="Contraseña" class="w-full p-3 mb-4 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-green-500">
          <button onclick="login()" class="w-full bg-green-500 hover:bg-green-400 text-slate-950 font-extrabold p-3 rounded-xl mb-2 transition-colors">Entrar</button>
          <button onclick="register()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold p-3 rounded-xl transition-colors">Registrarse ($0.00 vCUP)</button>
        </div>
      `;
    }

    function login() {
      const email = document.getElementById('authEmail').value;
      if (!email) return alert('Ingresa tu correo');
      const users = JSON.parse(localStorage.getItem('vcup_db_users') || '{}');
      const balance = users[email] !== undefined ? users[email] : 0.00;
      saveUser({ email, balance });
      navigate('wallet');
    }

    function register() {
      const email = document.getElementById('authEmail').value;
      if (!email) return alert('Ingresa tu correo');
      let users = JSON.parse(localStorage.getItem('vcup_db_users') || '{}');
      if (users[email] === undefined) {
        users[email] = 0.00;
        localStorage.setItem('vcup_db_users', JSON.stringify(users));
      }
      saveUser({ email, balance: users[email] });
      navigate('wallet');
    }

    function renderWallet(container) {
      container.innerHTML = `
        <div class="bg-gradient-to-br from-slate-900 via-slate-900 to-slate-950 p-6 rounded-2xl border border-slate-800 neon-border mb-6 text-center relative overflow-hidden">
          <p class="text-[11px] text-slate-400 uppercase tracking-widest font-bold mb-1">Saldo Disponible</p>
          <h2 class="text-4xl font-black text-green-400 mb-2">${state.user.balance.toFixed(2)} <span class="text-sm font-normal text-slate-300">vCUP</span></h2>
          <span class="inline-block bg-slate-800/80 border border-slate-700 text-slate-300 text-[10px] px-3 py-1 rounded-full">Recargas manuales vía WhatsApp</span>
        </div>

        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 mb-6">
          <h3 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
            <span>🚀</span> Transferir vCUP Instantáneo
          </h3>
          <input id="transferEmail" type="email" placeholder="Correo del destinatario" class="w-full p-3 mb-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-green-500">
          <input id="transferAmount" type="number" placeholder="Monto vCUP" class="w-full p-3 mb-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-green-500">
          <button onclick="sendTransfer()" class="w-full bg-blue-600 hover:bg-blue-500 font-bold p-3 rounded-xl text-white transition-colors">Enviar Saldo</button>
        </div>
      `;
    }

    function sendTransfer() {
      const email = document.getElementById('transferEmail').value;
      const amount = parseFloat(document.getElementById('transferAmount').value);
      if (!email || !amount || amount <= 0) return alert('Datos inválidos');
      if (amount > state.user.balance) return alert('Saldo vCUP insuficiente');

      let users = JSON.parse(localStorage.getItem('vcup_db_users') || '{}');
      if (users[email] === undefined) return alert('El correo de destino no existe');

      users[state.user.email] -= amount;
      users[email] += amount;
      localStorage.setItem('vcup_db_users', JSON.stringify(users));

      state.user.balance -= amount;
      saveUser(state.user);
      alert('Transferencia realizada con éxito');
    }

    function renderMatches(container) {
      container.innerHTML = `
        <div class="flex gap-2 mb-4">
          <button onclick="setSport('FOOTBALL')" class="flex-1 p-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition-all ${state.sport === 'FOOTBALL' ? 'bg-green-500 text-slate-950 shadow-md' : 'bg-slate-900 text-slate-400 border border-slate-800'}">⚽ Fútbol</button>
          <button onclick="setSport('BASEBALL')" class="flex-1 p-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition-all ${state.sport === 'BASEBALL' ? 'bg-green-500 text-slate-950 shadow-md' : 'bg-slate-900 text-slate-400 border border-slate-800'}">⚾ Béisbol MLB</button>
        </div>
        <div id="matchesList" class="space-y-4"></div>
      `;

      const matchesList = document.getElementById('matchesList');
      const filtered = state.matches.filter(m => m.sport === state.sport);

      if (filtered.length === 0) {
        matchesList.innerHTML = `<p class="text-center text-xs text-slate-500 py-8">No hay partidos disponibles o sincronizados.</p>`;
        return;
      }

      filtered.forEach(m => {
        const locked = isLocked(m.date);
        matchesList.innerHTML += `
          <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-lg">
            <div class="bg-slate-950/60 px-4 py-2 flex justify-between items-center text-[11px] text-slate-400 border-b border-slate-800">
              <span class="font-semibold text-green-400">${m.league}</span>
              <span>🕒 ${new Date(m.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            </div>
            <div class="p-4">
              <!-- Equipos con Logos HD de alta resolución -->
              <div class="flex justify-between items-center mb-4">
                <div class="flex flex-col items-center w-1/3 text-center">
                  <img src="${m.homeLogo || 'https://images.football-data.org/teams/64.png'}" alt="Logo" class="w-12 h-12 object-contain mb-1 drop-shadow-md">
                  <span class="text-xs font-bold text-white leading-tight">${m.homeTeam}</span>
                </div>
                <div class="text-xs font-black text-slate-500 px-2">VS</div>
                <div class="flex flex-col items-center w-1/3 text-center">
                  <img src="${m.awayLogo || 'https://images.football-data.org/teams/57.png'}" alt="Logo" class="w-12 h-12 object-contain mb-1 drop-shadow-md">
                  <span class="text-xs font-bold text-white leading-tight">${m.awayTeam}</span>
                </div>
              </div>

              <div class="bg-slate-950 p-2 rounded-xl text-center mb-3 border border-slate-800/60">
                <span class="text-[10px] text-slate-400 block uppercase tracking-wider">Pozo Acumulado</span>
                <span class="text-sm font-extrabold text-green-400">${m.totalPool} vCUP</span>
              </div>

              ${locked ? `
                <button disabled class="w-full bg-slate-800/60 text-slate-500 p-2.5 rounded-xl text-xs font-bold border border-slate-800">🔒 Apuestas Cerradas (60 min antes)</button>
              ` : `
                <div class="grid grid-cols-${m.sport === 'FOOTBALL' ? '3' : '2'} gap-2">
                  <button onclick="placeBet('${m.id}', 'HOME')" class="bg-slate-800 hover:bg-slate-700 text-green-400 p-2.5 rounded-xl text-xs font-bold transition-colors">1 (Local)</button>
                  ${m.sport === 'FOOTBALL' ? `<button onclick="placeBet('${m.id}', 'DRAW')" class="bg-slate-800 hover:bg-slate-700 text-yellow-400 p-2.5 rounded-xl text-xs font-bold transition-colors">X (Empate)</button>` : ''}
                  <button onclick="placeBet('${m.id}', 'AWAY')" class="bg-slate-800 hover:bg-slate-700 text-blue-400 p-2.5 rounded-xl text-xs font-bold transition-colors">2 (Visita)</button>
                </div>
              `}
            </div>
          </div>
        `;
      });
    }

    function setSport(s) {
      state.sport = s;
      render();
    }

    function placeBet(matchId, choice) {
      const amount = parseFloat(prompt("Monto vCUP a apostar al Pozo Común:"));
      if (!amount || amount <= 0) return;
      if (amount > state.user.balance) return alert("Saldo vCUP insuficiente");

      state.user.balance -= amount;
      saveUser(state.user);

      let users = JSON.parse(localStorage.getItem('vcup_db_users') || '{}');
      users[state.user.email] = state.user.balance;
      localStorage.setItem('vcup_db_users', JSON.stringify(users));

      alert(`Apuesta registrada por ${amount} vCUP`);
    }

    function renderBets(container) {
      container.innerHTML = `
        <h3 class="text-lg font-bold mb-4 text-green-400">Mis Apuestas Registradas</h3>
        <p class="text-xs text-slate-500 text-center py-6">Las ganancias del pozo común se acreditarán automáticamente al finalizar cada partido.</p>
      `;
    }

    function renderAdmin(container) {
      container.innerHTML = `
        <div class="bg-slate-900 p-6 rounded-2xl border border-red-500/30">
          <h2 class="text-xl font-bold text-red-400 mb-4">🔐 Admin Portal (Llave Maestra)</h2>
          <div id="adminLock">
            <input id="masterKeyInput" type="password" placeholder="Ingresa Llave Maestra" class="w-full p-3 mb-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none">
            <button onclick="unlockAdmin()" class="w-full bg-red-600 hover:bg-red-500 font-bold p-3 rounded-xl text-white transition-colors">Desbloquear Panel</button>
          </div>
          <div id="adminContent" class="hidden">
            <h3 class="font-bold text-sm text-slate-300 mb-2">Acreditar / Descontar Saldo</h3>
            <input id="admEmail" type="email" placeholder="Correo usuario" class="w-full p-2.5 mb-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white">
            <input id="admAmount" type="number" placeholder="Monto vCUP (+ o -)" class="w-full p-2.5 mb-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white">
            <button onclick="adminAdjustBalance()" class="w-full bg-green-500 font-bold p-2.5 rounded-xl text-slate-950 text-xs mb-4">Actualizar Saldo</button>

            <h3 class="font-bold text-sm text-slate-300 mb-2">Configurar Teléfono WhatsApp</h3>
            <input id="admWa" type="text" placeholder="Ej: 5351576767" class="w-full p-2.5 mb-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white">
            <button onclick="adminUpdateWa()" class="w-full bg-blue-600 font-bold p-2.5 rounded-xl text-white text-xs">Guardar WhatsApp</button>
          </div>
        </div>
      `;
    }

    function unlockAdmin() {
      const input = document.getElementById('masterKeyInput').value;
      if (input === ADMIN_KEY) {
        document.getElementById('adminLock').classList.add('hidden');
        document.getElementById('adminContent').classList.remove('hidden');
      } else {
        alert('Llave Maestra Incorrecta');
      }
    }

    function adminAdjustBalance() {
      const email = document.getElementById('admEmail').value;
      const amount = parseFloat(document.getElementById('admAmount').value);
      if (!email || isNaN(amount)) return alert('Datos erróneos');

      let users = JSON.parse(localStorage.getItem('vcup_db_users') || '{}');
      users[email] = (users[email] || 0) + amount;
      localStorage.setItem('vcup_db_users', JSON.stringify(users));

      if (state.user && state.user.email === email) {
        state.user.balance = users[email];
        saveUser(state.user);
      }
      alert(`Saldo de ${email} actualizado a ${users[email]} vCUP`);
    }

    function adminUpdateWa() {
      const wa = document.getElementById('admWa').value;
      if (!wa) return;
      document.getElementById('waButton').href = `https://wa.me/${wa}?text=Hola,%20deseo%20solicitar%20recarga%20de%20vCUP`;
      alert('Número de WhatsApp actualizado');
    }

    window.addEventListener('hashchange', render);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    fetchMatches().then(() => render());
  </script>
</body>
</html>
